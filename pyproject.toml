[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-autosec"
version = "0.1.0"
description = "Sparse expert autonomous vulnerability discovery and repair"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["sparse_autosec*"]
